name: Investigate Delayed Flight
description: Inspect flight, assigned crew, and duty clock before a mock roster action.
steps:
  - id: get_flight
    description: Read the flight schedule and current delay.
    tool: flight_get
    arguments:
      flight_id: "${flight_id}"
    destructive: false
    timeout: 15

  - id: inspect_crew
    description: Read the crew assigned to the flight.
    tool: flight_roster
    arguments:
      flight_id: "${flight_id}"
    destructive: false
    timeout: 15

  - id: inspect_duty
    description: Read the duty clock for the first assigned crew member.
    tool: duty_clock_get
    arguments:
      crew_id: "${inspect_crew[0].crew_id}"
    destructive: false
    timeout: 15

  - id: resolve_crew_issue
    description: Mock a roster action to demonstrate the approval boundary.
    tool: dangerous_test_action
    arguments:
      flight_id: "${flight_id}"
    destructive: true
    timeout: 15

  - id: verify
    description: Read the roster after the approved action.
    tool: flight_roster
    arguments:
      flight_id: "${flight_id}"
    destructive: false
    timeout: 15
