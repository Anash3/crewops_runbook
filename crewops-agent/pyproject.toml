[project]
name = "crewops-agent"
version = "0.1.0"
description = "CrewOps runbook execution backend"
authors = [{name = "Anash", email = "anash@example.com"}]
license = {text = "MIT"}
requires-python = ">=3.10,<4.0"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "uvicorn[standard]",
    "python-dotenv",
    "requests",
    "httpx>=0.27.0",
    "mcp>=1.9.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewops"]
