[project]
name = "crewops-mcp-server"
version = "0.1.0"
description = "FastMCP adapter for CrewOps tools and runbook execution"
requires-python = ">=3.10,<4.0"
dependencies = [
    "mcp>=1.9.0,<2",
    "httpx>=0.27.0",
    "uvicorn[standard]",
    "sqlalchemy>=2.0.54",
    "psycopg>=3.2.13",
    "psycopg2-binary",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewops_mcp"]
